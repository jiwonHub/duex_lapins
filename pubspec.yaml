name: deux_lapins
description: Modern fashion commerce UI for Web, iOS, Android and Windows.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 17.5.0
  google_fonts: ^8.2.1
  kakao_flutter_sdk_common: 2.0.1
  kakao_flutter_sdk_auth: 2.0.1
  kakao_flutter_sdk_user: 2.0.1
  http: ^1.6.0
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/kakao_config.json
    - assets/images/deux_lapins_logo2.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/deux_lapins_logo2.png"
  remove_alpha_ios: true

  adaptive_icon_background: "#F7F4EE"
  adaptive_icon_foreground: "assets/images/deux_lapins_logo2.png"

  web:
    generate: true
    image_path: "assets/images/deux_lapins_logo2.png"
    background_color: "#F7F4EE"
    theme_color: "#F7F4EE"

  windows:
    generate: true
    image_path: "assets/images/deux_lapins_logo2.png"
    icon_size: 256